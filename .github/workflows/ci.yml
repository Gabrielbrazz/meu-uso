name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pricing:
    name: Pricing supplement
    # Installed apps fetch Sources/MeuUso/Resources/pricing_supplement.json straight from `main`
    # (raw.githubusercontent.com), so a malformed edit must never merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate supplement JSON
        run: |
          python3 - << 'PY'
          import json, re, sys
          with open("Sources/MeuUso/Resources/pricing_supplement.json") as f:
              supplement = json.load(f)
          problems = []
          for model, entry in supplement["pricing"].items():
              for field in ("input_per_million", "output_per_million"):
                  if not isinstance(entry.get(field), (int, float)):
                      problems.append(f"pricing[{model}].{field} missing or not a number")
          for rule in supplement["alias_rules"]:
              try:
                  re.compile(rule["pattern"])
              except re.error as error:
                  problems.append(f"alias pattern {rule['pattern']!r}: {error}")
              if not rule.get("canonical"):
                  problems.append(f"alias pattern {rule['pattern']!r} has no canonical")
          for model, multiplier in (supplement.get("fast_multipliers") or {}).items():
              if not isinstance(multiplier, (int, float)) or multiplier <= 0:
                  problems.append(f"fast_multipliers[{model}] must be a positive number")
          if problems:
              sys.exit("Supplement validation failed:\n" + "\n".join(problems))
          print(f"Supplement OK: {len(supplement['pricing'])} models, "
                f"{len(supplement['alias_rules'])} alias rules.")
          PY

  check:
    name: Build and Test
    # Builds against the macOS 26 SDK with the package's macOS 15 deployment target (Package.swift
    # .macOS(.v15)), so this compiles the whole codebase — including the `if #available(macOS 26, *)`
    # Liquid Glass branches — for the macOS 15 floor. That is the floor's compile guarantee: a binary
    # built here reports minos 15.0. We do NOT add a macos-15 runner leg — back-deployment compiles
    # against the newest SDK, and a stock macos-15 runner ships Swift 6.1 without the macOS 26 SDK, so
    # it cannot build this package. Runtime verification on Sequoia is a manual smoke pass.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test
