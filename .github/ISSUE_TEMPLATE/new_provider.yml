name: Pedir um provedor novo
description: Pedir ou propor suporte a um provedor de IA
labels: ["provedor"]
body:
  - type: markdown
    attributes:
      value: |
        Quer ver outro provedor de IA no Meu Uso? Preencha abaixo.
        Pode ser só o pedido, ou você mesmo implementa e abre um PR.
  - type: input
    id: provider_name
    attributes:
      label: Nome do provedor
      placeholder: "ex.: Gemini, Perplexity"
    validations:
      required: true
  - type: input
    id: provider_url
    attributes:
      label: Site do provedor
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Que dados de uso o provedor expõe?
      description: Descreva métricas, limites e como acessar (API, painel etc.). Cite só o tipo de autenticação; nunca cole chaves, tokens ou cookies reais.
      placeholder: |
        - Limite mensal de requisições: 500
        - Acesso: painel em provedor.com/usage
        - Autenticação: cookie de sessão
    validations:
      required: true
  - type: dropdown
    id: will_build
    attributes:
      label: Você vai implementar?
      options:
        - "Sim, vou abrir um PR"
        - "Não, é só o pedido"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Mais contexto
      description: Links para a documentação da API, prints do painel de uso ou o que mais ajudar.
