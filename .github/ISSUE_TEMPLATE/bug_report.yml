name: Relatar um bug
description: Algo não funciona como deveria no Meu Uso
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar. Quanto mais detalhes, mais rápido dá para corrigir.
        Nunca cole chaves de API, tokens ou cookies.
  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: O que aconteceu?
      placeholder: Uma descrição clara do bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Como chegar no problema?
      placeholder: |
        1. Abra o Meu Uso
        2. Vá em ...
        3. Clique em ...
        4. Veja o erro
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que deveria acontecer
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: O que aconteceu de fato
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão do Meu Uso
      description: Aparece no rodapé do painel e em "Sobre o Meu Uso".
      placeholder: "ex.: 0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: Versão do macOS
      description: O Meu Uso precisa do macOS 15 (Sequoia) ou mais novo.
      placeholder: "ex.: 26.0"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Tipo de Mac
      options:
        - Apple Silicon
        - Intel
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Prints
      description: Se ajudar, arraste ou cole imagens aqui (esconda dados pessoais).
  - type: textarea
    id: additional
    attributes:
      label: Mais contexto
      description: Qualquer outra informação útil, como trechos do log em ~/Library/Logs/MeuUso.
