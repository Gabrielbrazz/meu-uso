name: Sugerir uma melhoria
description: Ideia de recurso ou melhoria para o Meu Uso
labels: ["melhoria"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de sugerir, veja se já existe uma issue parecida.
        O Meu Uso foca em acompanhar o uso das assinaturas de IA.
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Que problema isso resolve? O que falta ou incomoda hoje?
      placeholder: Eu queria ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposta
      description: Como você imagina que deveria funcionar?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Pensou em outros caminhos? Por que este é melhor?
  - type: textarea
    id: additional
    attributes:
      label: Mais contexto
      description: Prints, rascunhos, links ou o que mais ajudar a explicar.
